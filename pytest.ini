[pytest]
testpaths = tests
# Every run writes:
#   reports/report.html  - the test report (pass/fail, duration, description,
#                          and a screenshot embedded for each failed test)
#   test-results/        - video and Playwright trace of each failed test
#                          (open a trace: python -m playwright show-trace <trace.zip>)
addopts =
    --browser chromium
    --html=reports/report.html
    --self-contained-html
    --video retain-on-failure
    --tracing retain-on-failure
    --output test-results
markers =
    smoke: quick checks that the app is up and sign-in works
